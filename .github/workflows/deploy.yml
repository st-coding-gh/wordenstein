name: deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create Environment File
        run: echo "${{ secrets.ENV }}" > .env

      - name: Make a Directory for SSH
        run: mkdir -p "$HOME/.ssh"

      - name: Copy SSH Key from Secrets
        run: echo "${{ secrets.KEY }}" > "$HOME/.ssh/key"

      - name: Set SSH Key Permissions
        run: chmod 600 "$HOME/.ssh/key"

      - name: Upload to Server
        run: |
          rsync -e "ssh -p 2244 -i $HOME/.ssh/key -o StrictHostKeyChecking=no" \
            --archive \
            --compress \
            --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=database/prod.db \
            --exclude=uploads \
            . ${{ secrets.USER }}@${{ secrets.IP }}:${{ secrets.PATH }}

      - name: Deploy with Docker Compose
        run: |
          ssh -p 2244 -i "$HOME/.ssh/key" -o StrictHostKeyChecking=no ${{ secrets.USER }}@${{ secrets.IP }} << EOF
            set -e
            cd ${{ secrets.PATH }}
            command -v docker >/dev/null || { echo "Docker is not installed on the VPS"; exit 1; }
            docker compose version >/dev/null || { echo "Docker Compose plugin is not installed on the VPS"; exit 1; }
            mkdir -p database uploads/images/cards
            pm2 stop wordenstein || true
            pm2 delete wordenstein || true
            pkill -f "[u]vicorn main:app" || true
            COMPOSE_PARALLEL_LIMIT=1 docker compose build lemma
            COMPOSE_PARALLEL_LIMIT=1 docker compose build wordenstein
            docker compose run --rm wordenstein npx prisma migrate deploy --schema=./database/schema.prisma
            docker compose up -d
            docker compose ps
            docker builder prune -f
          EOF
